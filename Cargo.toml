[package]
name = "bluebl"
version = "0.1.0"
edition = "2021"
description = "Chat mesh por Bluetooth LE desde la terminal"
license = "MIT"
repository = "https://github.com/L3IB0R/bluebl"

[dependencies]
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
ratatui = "0.30"
crossterm = "0.29"
btleplug = "0.11"
zbus = "5"
futures = "0.3"
uuid = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
qrcode = "0.14"

[profile.release]
strip = true
lto = true
